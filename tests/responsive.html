<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS/42 — Layout lab</title>
<style>body{margin:0;background:#070e14;color:#d8e2e8;font:13px system-ui}header{position:sticky;top:0;display:flex;gap:12px;align-items:center;background:#13232d;padding:12px;z-index:2}button{color:inherit;background:#284451;border:1px solid #7196a6;padding:9px 15px;cursor:pointer}iframe{display:block;border:1px solid #496675;margin:12px;width:1024px;height:768px}output{font-family:monospace}</style>
<header><strong>Layout lab</strong><button data-w="1024" data-h="768">iPad landscape</button><button data-w="768" data-h="1024">iPad portrait</button><button data-w="1366" data-h="1024">iPad Pro</button><button data-w="1920" data-h="1080">TV</button><button data-w="390" data-h="844">Phone</button><output>1024 × 768</output></header>
<iframe title="BOS/42 device preview" src="/"></iframe>
<script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px';document.querySelector('output').textContent=b.dataset.w+' × '+b.dataset.h;};</script></html>
